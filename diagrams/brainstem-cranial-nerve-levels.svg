<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Brainstem levels and cranial nerve groups</title><desc id="desc">A schematic brainstem identifies midbrain cranial nerves three and four, pons nerves five through eight, and medulla nerves nine through twelve, with a note that the eleventh nerve has spinal roots.</desc><rect width="1200" height="700" rx="28" fill="#f4f8fb"/><text x="60" y="66" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0a2034">Brainstem levels: a cranial-nerve orientation map</text><text x="60" y="104" font-family="Arial,sans-serif" font-size="18" fill="#526879">A learning schematic of broad level associations; nuclei and nerve rootlets are more complex.</text><g stroke="#0a2034" stroke-width="4" stroke-linejoin="round"><path d="M340 180 C300 210 292 265 320 300 L350 325 L350 390 C310 420 300 465 320 505 C340 550 385 562 420 542 C450 524 458 487 448 455 L430 390 L430 325 C470 290 470 235 440 195 C415 164 375 162 340 180Z" fill="#e6eef5"/><path d="M335 190 C310 220 312 265 345 292 L425 292 C457 259 450 216 423 190 C400 170 358 170 335 190Z" fill="#ef8f7a"/><path d="M325 300 C298 328 302 378 334 403 L430 403 C460 376 462 329 430 300Z" fill="#78c9c2"/><path d="M334 408 C305 435 314 488 343 514 C366 535 403 535 426 513 C449 488 449 436 427 408Z" fill="#f5c76c"/><path d="M360 514 L365 585 L405 585 L410 514" fill="#c8d8e8"/></g><g font-family="Arial,sans-serif" fill="#0a2034"><path d="M435 230 L520 230 L560 190 L700 190" stroke="#0a2034" stroke-width="3" fill="none"/><text x="575" y="170" font-size="22" font-weight="700">MIDBRAIN</text><text x="575" y="201" font-size="20">CN III (oculomotor), IV (trochlear)</text><path d="M445 348 L530 348 L570 310 L700 310" stroke="#0a2034" stroke-width="3" fill="none"/><text x="575" y="290" font-size="22" font-weight="700">PONS</text><text x="575" y="321" font-size="20">CN V, VI, VII, VIII</text><path d="M430 463 L520 463 L560 425 L700 425" stroke="#0a2034" stroke-width="3" fill="none"/><text x="575" y="405" font-size="22" font-weight="700">MEDULLA</text><text x="575" y="436" font-size="20">CN IX, X, XII; cranial part of XI traditionally described</text><path d="M407 555 L520 555 L560 555 L700 555" stroke="#0a2034" stroke-width="3" fill="none"/><text x="575" y="535" font-size="22" font-weight="700">UPPER CERVICAL SPINAL CORD</text><text x="575" y="566" font-size="20">Spinal root of CN XI ascends to the skull</text><rect x="760" y="220" width="360" height="220" rx="20" fill="#fff" stroke="#cddbe5" stroke-width="2"/><text x="790" y="260" font-size="23" font-weight="700">Memory cue</text><text x="790" y="304" font-size="24" font-weight="700" fill="#087d70">3–4 / 5–8 / 9–12</text><text x="790" y="340" font-size="19">Midbrain / Pons / Medulla</text><text x="790" y="380" font-size="17">A broad revision pattern, not a substitute</text><text x="790" y="405" font-size="17">for learning each nucleus and pathway.</text><text x="60" y="655" font-size="17" fill="#526879">Clinical application: localise lesions using the combination of cranial-nerve signs, long-tract findings and level.</text></g></svg>