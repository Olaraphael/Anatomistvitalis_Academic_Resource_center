<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 500" role="img" aria-labelledby="t d"><title id="t">Endocrine axis and negative feedback</title><desc id="d">Simplified hypothalamic-pituitary-target gland axis with stimulatory signalling and negative feedback.</desc><rect width="1000" height="500" rx="24" fill="#f4f8fb"/><text x="500" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0a2034">HYPOTHALAMIC–PITUITARY–TARGET GLAND AXIS</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="90" y="115" width="220" height="90" rx="16" fill="#d5b3eb" stroke="#7950a0" stroke-width="3"/><rect x="390" y="115" width="220" height="90" rx="16" fill="#9bcde8" stroke="#21618b" stroke-width="3"/><rect x="690" y="115" width="220" height="90" rx="16" fill="#f1d17a" stroke="#99731d" stroke-width="3"/><g fill="#0a2034" font-size="20" font-weight="700"><text x="200" y="153">Hypothalamus</text><text x="500" y="153">Anterior pituitary</text><text x="800" y="153">Target gland</text></g><g fill="#526879" font-size="15"><text x="200" y="180">Releasing hormone</text><text x="500" y="180">Tropic hormone</text><text x="800" y="180">Peripheral hormone</text></g><g stroke="#18b8a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M310 160 H382 l-9 -8 m9 8 l-9 8"/><path d="M610 160 H682 l-9 -8 m9 8 l-9 8"/></g><rect x="390" y="315" width="220" height="75" rx="14" fill="#e2f8f4" stroke="#087e74" stroke-width="3"/><text x="500" y="346" font-size="18" font-weight="700" fill="#0a2034">Target-tissue effects</text><text x="500" y="370" font-size="14" fill="#526879">Regulated response</text><path d="M800 205 V274 H610 V307" stroke="#18b8a6" stroke-width="4" fill="none" stroke-linejoin="round"/><path d="M610 307 l-8 -9 m8 9 l8 -9" stroke="#18b8a6" stroke-width="4" fill="none"/><path d="M800 115 V80 H200 V107" stroke="#b85d32" stroke-width="4" stroke-dasharray="10 8" fill="none" stroke-linejoin="round"/><path d="M200 107 l-8 -9 m8 9 l8 -9" stroke="#b85d32" stroke-width="4" fill="none"/><text x="500" y="70" text-anchor="middle" font-size="16" font-weight="700" fill="#b85d32">Negative feedback reduces upstream drive</text></g><text x="500" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526879">Generic model: the specific hormones and feedback sites differ among endocrine axes.</text></svg>