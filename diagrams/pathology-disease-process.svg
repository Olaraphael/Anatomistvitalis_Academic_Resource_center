<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">Framework for understanding disease</title><desc id="d">A conceptual sequence connecting cause, mechanism, structural and functional changes, clinical manifestations and outcomes.</desc><rect width="1000" height="430" rx="24" fill="#f4f8fb"/><text x="500" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0a2034">A FRAMEWORK FOR UNDERSTANDING DISEASE</text><g font-family="Arial,sans-serif" text-anchor="middle"><g stroke-width="3"><rect x="35" y="125" width="170" height="115" rx="14" fill="#d5b3eb" stroke="#7950a0"/><rect x="225" y="125" width="170" height="115" rx="14" fill="#9bcde8" stroke="#21618b"/><rect x="415" y="125" width="170" height="115" rx="14" fill="#f1d17a" stroke="#99731d"/><rect x="605" y="125" width="170" height="115" rx="14" fill="#f5b88e" stroke="#b85d32"/><rect x="795" y="125" width="170" height="115" rx="14" fill="#e2f8f4" stroke="#087e74"/></g><g fill="#0a2034" font-size="19" font-weight="700"><text x="120" y="165">Aetiology</text><text x="120" y="190" font-size="15" font-weight="400">Cause or risk</text><text x="310" y="165">Pathogenesis</text><text x="310" y="190" font-size="15" font-weight="400">Mechanism</text><text x="500" y="165">Morphology</text><text x="500" y="190" font-size="15" font-weight="400">Structural change</text><text x="690" y="165">Function</text><text x="690" y="190" font-size="15" font-weight="400">Physiological effect</text><text x="880" y="165">Manifestation</text><text x="880" y="190" font-size="15" font-weight="400">Signs and symptoms</text></g><g stroke="#18b8a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M205 182 H218 l-6 -7 m6 7 l-6 7"/><path d="M395 182 H408 l-6 -7 m6 7 l-6 7"/><path d="M585 182 H598 l-6 -7 m6 7 l-6 7"/><path d="M775 182 H788 l-6 -7 m6 7 l-6 7"/></g></g><text x="500" y="300" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#192d3c">Outcomes are influenced by severity, host response, treatment and time.</text><text x="500" y="335" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526879">This is a reasoning framework: real diseases may not follow a simple linear sequence.</text></svg>