<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Physiotherapy movement assessment schematic</title><desc id="d">Original clinical line-art schematic showing a standing person, alignment guides, and joint range measurement concept.</desc><rect width="900" height="500" rx="22" fill="#f6fafc"/><path d="M40 420H860" stroke="#cad8e1" stroke-width="2"/><g stroke="#193c52" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" fill="none"><circle cx="285" cy="87" r="34"/><path d="M267 121 Q247 148 252 190 L257 238 Q260 260 281 262 L310 259 Q328 255 324 231 L318 187 Q320 151 304 122"/><path d="M255 148 L213 214 L189 280"/><path d="M315 149 L358 212 L383 273"/><path d="M274 260 L252 340 L246 414"/><path d="M307 260 L329 340 L337 414"/><path d="M228 416 L260 416 M320 416 L351 416"/></g><g stroke="#18a999" stroke-width="2.5" stroke-dasharray="7 7" fill="none"><path d="M285 32V430"/><path d="M225 155H350"/><path d="M225 260H350"/><path d="M220 340H355"/></g><g fill="#0a2034" font-family="Arial,sans-serif"><text x="455" y="90" font-size="24" font-weight="700">Observe before you measure</text><text x="455" y="130" font-size="17">• Posture and alignment</text><text x="455" y="165" font-size="17">• Active and passive movement</text><text x="455" y="200" font-size="17">• Strength and functional tasks</text><text x="455" y="235" font-size="17">• Symptoms and safety signs</text><text x="455" y="305" font-size="15" fill="#557080">Schematic for learning only</text><text x="455" y="330" font-size="15" fill="#557080">Not a diagnostic reference image</text></g><g fill="#18b8a6"><circle cx="285" cy="155" r="7"/><circle cx="285" cy="260" r="7"/><circle cx="285" cy="340" r="7"/></g><text x="450" y="465" text-anchor="middle" fill="#557080" font-family="Arial,sans-serif" font-size="13">ANATOMISTVITALIS · ORIGINAL EDUCATIONAL LINE ART</text></svg>