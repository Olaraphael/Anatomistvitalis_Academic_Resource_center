<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Schematic lateral cerebral cortex and functional landmarks</title><desc id="desc">A simplified lateral view labels frontal, parietal, temporal and occipital lobes, primary motor and sensory strips, Broca area, Wernicke region and visual cortex.</desc><rect width="1200" height="760" rx="28" fill="#f4f8fb"/><text x="60" y="70" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#0a2034">Cerebral cortex: lobes and selected functional landmarks</text><text x="60" y="108" font-family="Arial,sans-serif" font-size="18" fill="#526879">Educational schematic — locations and borders are simplified, not to scale.</text><g stroke="#0a2034" stroke-width="5" stroke-linejoin="round"><path d="M145 385 C118 310 165 240 236 217 C270 153 348 137 412 166 C467 119 542 133 578 177 C645 155 712 189 731 238 C799 250 837 300 824 356 C850 409 808 462 755 470 C721 521 655 535 601 510 C551 544 489 530 453 501 C391 520 333 492 312 454 C240 467 180 439 145 385Z" fill="#e6eef5"/><path d="M160 365 C145 305 188 250 250 228 C290 179 351 160 407 184 L421 300 L376 408 L315 450 C248 461 187 426 160 365Z" fill="#f5c76c"/><path d="M407 184 C466 145 534 150 578 184 L564 285 L492 317 L421 300Z" fill="#ef8f7a"/><path d="M421 300 L492 317 L520 410 L453 501 C391 520 333 492 312 454 L376 408Z" fill="#78c9c2"/><path d="M578 184 C645 155 712 189 731 238 C799 250 837 300 824 356 L744 354 L697 300 L564 285Z" fill="#9cc5ef"/><path d="M564 285 L697 300 L744 354 L755 470 C721 521 655 535 601 510 L520 410 L492 317Z" fill="#d9e5ef"/><path d="M420 186 C444 229 448 264 438 301" fill="none" stroke="#0a2034" stroke-width="8"/><path d="M438 301 C455 333 450 365 430 394" fill="none" stroke="#0a2034" stroke-width="8"/><path d="M310 320 C340 300 365 300 392 314" fill="none" stroke="#0a2034" stroke-width="4"/><path d="M498 397 C540 375 572 376 604 392" fill="none" stroke="#0a2034" stroke-width="4"/></g><g font-family="Arial,sans-serif" fill="#0a2034"><text x="205" y="278" font-size="25" font-weight="700">FRONTAL</text><text x="465" y="222" font-size="22" font-weight="700">PARIETAL</text><text x="343" y="456" font-size="22" font-weight="700">TEMPORAL</text><text x="695" y="270" font-size="21" font-weight="700">OCCIPITAL</text><path d="M405 184 L365 143 L245 143" fill="none" stroke="#0a2034" stroke-width="3"/><text x="245" y="133" font-size="18">Precentral gyrus</text><text x="245" y="156" font-size="18" font-weight="700">Primary motor cortex</text><path d="M439 303 L486 135 L635 135" fill="none" stroke="#0a2034" stroke-width="3"/><text x="635" y="126" font-size="18">Postcentral gyrus</text><text x="635" y="149" font-size="18" font-weight="700">Primary somatosensory cortex</text><path d="M325 326 L246 552 L95 552" fill="none" stroke="#0a2034" stroke-width="3"/><text x="95" y="578" font-size="18" font-weight="700">Broca region*</text><text x="95" y="602" font-size="17">Speech production</text><path d="M544 395 L585 550 L760 550" fill="none" stroke="#0a2034" stroke-width="3"/><text x="760" y="576" font-size="18" font-weight="700">Posterior temporal region*</text><text x="760" y="600" font-size="17">Language comprehension</text><path d="M785 365 L866 410 L1020 410" fill="none" stroke="#0a2034" stroke-width="3"/><text x="866" y="438" font-size="18" font-weight="700">Visual cortex</text><text x="866" y="462" font-size="17">Around calcarine sulcus</text><text x="60" y="688" font-size="17" fill="#526879">*Language regions shown schematically in the usual dominant hemisphere; individual organisation varies.</text><text x="60" y="720" font-size="17" fill="#526879">Clinical cue: ACA often affects medial leg areas; MCA often affects lateral face/arm areas; PCA often affects vision.</text></g></svg>