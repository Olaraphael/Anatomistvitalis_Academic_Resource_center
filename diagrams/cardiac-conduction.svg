<circle cx="260" cy="151" r="9" fill="#e4a13a" stroke="#fff" stroke-width="2"/><path d="M260 151 L178 158 L92 158" fill="none" stroke="#087f75" stroke-width="1.7"/><text x="32" y="150" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#12334b">AV node</text><text x="32" y="165" font-family="Arial,sans-serif" font-size="10" fill="#526879">Brief delay</text>
<path d="M260 160 L260 201" stroke="#087f75" stroke-width="4" marker-end="url(#arrow)"/><text x="272" y="185" font-family="Arial,sans-serif" font-size="11" fill="#12334b">Bundle of His</text>
<path d="M260 201 L222 231 L202 262 M260 201 L299 231 L322 262" fill="none" stroke="#087f75" stroke-width="4" stroke-linecap="round"/>
<path d="M202 262 L176 284 M202 262 L215 293 M322 262 L348 284 M322 262 L309 293 M176 284 L164 304 M215 293 L224 313 M348 284 L360 304 M309 293 L300 313" fill="none" stroke="#e4a13a" stroke-width="3" stroke-linecap="round"/>
