<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="360" viewBox="0 0 520 360" role="img" aria-labelledby="title desc">
<title id="title">Cardiac electrical conduction system</title><desc id="desc">Original schematic showing impulse propagation from the sinoatrial node through the atrioventricular node, bundle of His, bundle branches and Purkinje fibres.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#087f75"/></marker></defs>
<rect width="520" height="360" rx="18" fill="#f7fbfd"/><text x="260" y="28" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#12334b">Cardiac conduction system (schematic)</text>
<path d="M240 68 C190 38 137 64 142 117 C146 151 191 190 258 231 C324 188 371 147 373 112 C377 63 326 40 281 69 C270 76 263 88 258 98 C253 87 248 76 240 68Z" fill="#f7b7b1" stroke="#b44e61" stroke-width="2.5"/>
<path d="M258 99 L258 225" stroke="#fff0e8" stroke-width="3" stroke-dasharray="5 5"/>
