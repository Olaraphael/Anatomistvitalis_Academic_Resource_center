<path d="M350 296 L398 309" stroke="#e4a13a" stroke-width="1.7"/><text x="400" y="307" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#12334b">Purkinje fibres</text><text x="400" y="322" font-family="Arial,sans-serif" font-size="10" fill="#526879">Spread through</text><text x="400" y="335" font-family="Arial,sans-serif" font-size="10" fill="#526879">ventricles</text>
<path d="M311 100 Q340 126 280 145" fill="none" stroke="#087f75" stroke-width="2" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text x="260" y="345" text-anchor="middle" font-family="Arial,sans-serif" font-size="10" fill="#71818b">Not to scale • educational schematic • not for diagnosis</text></svg>