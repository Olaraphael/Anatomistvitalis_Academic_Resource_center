<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" role="img" aria-labelledby="t d"><title id="t">Neuron structure</title><desc id="d">Schematic multipolar neuron showing dendrites, cell body, nucleus, axon, myelin segments, nodes of Ranvier and axon terminals.</desc><rect width="1000" height="460" rx="24" fill="#f4f8fb"/><text x="500" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0a2034">STRUCTURE OF A MULTIPOLAR NEURON</text><g stroke="#21618b" stroke-width="8" stroke-linecap="round" fill="none"><path d="M170 230 L116 180 L85 142 M116 180 L82 195 M170 230 L116 270 L86 308 M116 270 L79 266 M170 230 L137 158 L143 116 M170 230 L137 302 L148 345"/></g><circle cx="205" cy="230" r="55" fill="#d5b3eb" stroke="#7950a0" stroke-width="4"/><circle cx="214" cy="225" r="18" fill="#7950a0"/><path d="M260 230 H800" stroke="#21618b" stroke-width="12" stroke-linecap="round"/><g fill="#9bcde8" stroke="#21618b" stroke-width="3"><rect x="310" y="198" width="92" height="64" rx="24"/><rect x="435" y="198" width="92" height="64" rx="24"/><rect x="560" y="198" width="92" height="64" rx="24"/><rect x="685" y="198" width="92" height="64" rx="24"/></g><path d="M402 230 H435 M527 230 H560 M652 230 H685" stroke="#f4f8fb" stroke-width="15"/><g stroke="#b85d32" stroke-width="5" fill="none" stroke-linecap="round"><path d="M800 230 L848 198 L875 174 M848 198 L887 202 M800 230 L850 255 L879 285 M850 255 L891 255 M800 230 L846 226 L882 228"/></g><g font-family="Arial,sans-serif" fill="#0a2034" font-size="18" font-weight="700"><text x="72" y="93">Dendrites</text><text x="160" y="325">Cell body</text><text x="181" y="355">and nucleus</text><text x="430" y="130">Axon</text><text x="560" y="310">Myelin segments</text><text x="690" y="160">Nodes of Ranvier</text><text x="808" y="335">Axon terminals</text></g><g stroke="#617b8d" stroke-width="2" fill="none"><path d="M125 100 L143 153"/><path d="M210 312 L210 286"/><path d="M465 143 L465 210"/><path d="M600 290 L600 263"/><path d="M735 174 L735 193"/><path d="M850 316 L850 273"/></g><text x="500" y="414" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526879">Schematic only; neuron shapes, dendritic trees and myelination vary widely by cell type.</text></svg>