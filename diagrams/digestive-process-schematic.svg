<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">Digestive processing and absorption</title><desc id="d">Simplified sequence of digestion through mouth, stomach, small intestine and large intestine.</desc><rect width="1000" height="470" rx="24" fill="#f4f8fb"/><text x="500" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0a2034">DIGESTION: PROCESSING, BREAKDOWN AND ABSORPTION</text><g font-family="Arial,sans-serif" text-anchor="middle"><g stroke-width="3"><rect x="45" y="105" width="190" height="155" rx="16" fill="#d9e8f1" stroke="#21618b"/><rect x="275" y="105" width="190" height="155" rx="16" fill="#f5b88e" stroke="#b85d32"/><rect x="505" y="105" width="220" height="155" rx="16" fill="#e2f8f4" stroke="#087e74"/><rect x="765" y="105" width="190" height="155" rx="16" fill="#f1d17a" stroke="#99731d"/></g><g fill="#0a2034" font-size="20" font-weight="700"><text x="140" y="140">Mouth</text><text x="370" y="140">Stomach</text><text x="615" y="140">Small intestine</text><text x="860" y="140">Large intestine</text></g><g fill="#526879" font-size="15"><text x="140" y="177">Chewing; saliva</text><text x="140" y="199">begins starch</text><text x="140" y="221">digestion</text><text x="370" y="177">Mixing; acid and</text><text x="370" y="199">pepsin begin</text><text x="370" y="221">protein digestion</text><text x="615" y="177">Bile and enzymes;</text><text x="615" y="199">most digestion and</text><text x="615" y="221">nutrient absorption</text><text x="860" y="177">Water/electrolyte</text><text x="860" y="199">absorption; stool</text><text x="860" y="221">formation</text></g><g stroke="#18b8a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M238 182 H266 l-8 -8 m8 8 l-8 8"/><path d="M468 182 H496 l-8 -8 m8 8 l-8 8"/><path d="M728 182 H756 l-8 -8 m8 8 l-8 8"/></g><rect x="165" y="315" width="670" height="72" rx="14" fill="#fff" stroke="#dce6eb" stroke-width="2"/><text x="500" y="344" text-anchor="middle" font-size="19" font-weight="700" fill="#0a2034">Nutrients cross the intestinal epithelium</text><text x="500" y="369" text-anchor="middle" font-size="15" fill="#526879">Absorbed products enter blood or lymph depending on the substance.</text></g><text x="500" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526879">Simplified physiology map; digestion and absorption vary by nutrient and intestinal segment.</text></svg>