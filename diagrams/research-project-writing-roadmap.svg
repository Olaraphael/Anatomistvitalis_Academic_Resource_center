<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">Research project workflow</title><desc id="desc">A six-step roadmap from research question through literature review, methods, ethics and data collection, analysis, and clear reporting.</desc>
<rect width="1200" height="420" rx="28" fill="#f3f7fa"/>
<text x="600" y="55" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#0a2034">FROM RESEARCH QUESTION TO CLEAR REPORT</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<g transform="translate(35 105)"><rect width="350" height="105" rx="18" fill="#fff" stroke="#cbdde5" stroke-width="2"/><circle cx="42" cy="35" r="22" fill="#087d70"/><text x="42" y="43" font-size="22" font-weight="700" fill="#fff">1</text><text x="190" y="39" font-size="22" font-weight="700" fill="#0a2034">Define the question</text><text x="190" y="72" font-size="17" fill="#526879">Aim · objectives · research gap</text></g>
<path d="M390 157 H420" stroke="#087d70" stroke-width="5" stroke-linecap="round"/><path d="M411 147 L423 157 L411 167" fill="none" stroke="#087d70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(430 105)"><rect width="350" height="105" rx="18" fill="#fff" stroke="#cbdde5" stroke-width="2"/><circle cx="42" cy="35" r="22" fill="#087d70"/><text x="42" y="43" font-size="22" font-weight="700" fill="#fff">2</text><text x="195" y="39" font-size="22" font-weight="700" fill="#0a2034">Review evidence</text><text x="195" y="72" font-size="17" fill="#526879">Search · compare · cite sources</text></g>
<path d="M785 157 H815" stroke="#087d70" stroke-width="5" stroke-linecap="round"/><path d="M806 147 L818 157 L806 167" fill="none" stroke="#087d70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(825 105)"><rect width="340" height="105" rx="18" fill="#fff" stroke="#cbdde5" stroke-width="2"/><circle cx="42" cy="35" r="22" fill="#087d70"/><text x="42" y="43" font-size="22" font-weight="700" fill="#fff">3</text><text x="192" y="39" font-size="22" font-weight="700" fill="#0a2034">Plan methods</text><text x="192" y="72" font-size="17" fill="#526879">Design · sample · measures</text></g>
<path d="M995 218 V250 H600 V270" fill="none" stroke="#087d70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/><path d="M590 260 L600 273 L610 260" fill="none" stroke="#087d70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(35 280)"><rect width="350" height="105" rx="18" fill="#fff" stroke="#cbdde5" stroke-width="2"/><circle cx="42" cy="35" r="22" fill="#087d70"/><text x="42" y="43" font-size="22" font-weight="700" fill="#fff">4</text><text x="195" y="39" font-size="22" font-weight="700" fill="#0a2034">Collect responsibly</text><text x="195" y="72" font-size="17" fill="#526879">Ethics · quality · raw records</text></g>
<path d="M390 332 H420" stroke="#087d70" stroke-width="5" stroke-linecap="round"/><path d="M411 322 L423 332 L411 342" fill="none" stroke="#087d70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(430 280)"><rect width="350" height="105" rx="18" fill="#fff" stroke="#cbdde5" stroke-width="2"/><circle cx="42" cy="35" r="22" fill="#087d70"/><text x="42" y="43" font-size="22" font-weight="700" fill="#fff">5</text><text x="195" y="39" font-size="22" font-weight="700" fill="#0a2034">Analyse the data</text><text x="195" y="72" font-size="17" fill="#526879">Tables · estimates · interpretation</text></g>
<path d="M785 332 H815" stroke="#087d70" stroke-width="5" stroke-linecap="round"/><path d="M806 322 L818 332 L806 342" fill="none" stroke="#087d70" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
