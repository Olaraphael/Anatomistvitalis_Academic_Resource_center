<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" role="img" aria-labelledby="t d"><title id="t">Milestones in the study of anatomy</title><desc id="d">A high-level timeline from early anatomical observation through dissection, microscopy, radiology and modern imaging.</desc><rect width="1000" height="430" rx="24" fill="#f4f8fb"/><text x="500" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0a2034">HOW ANATOMY IS STUDIED: A BROAD TIMELINE</text><path d="M95 215 H905" stroke="#18b8a6" stroke-width="6" stroke-linecap="round"/><g font-family="Arial,sans-serif" text-anchor="middle"><g><circle cx="125" cy="215" r="18" fill="#d5b3eb" stroke="#7950a0" stroke-width="3"/><text x="125" y="102" font-size="19" font-weight="700" fill="#0a2034">Early observation</text><text x="125" y="130" font-size="15" fill="#526879">Clinical experience</text><text x="125" y="151" font-size="15" fill="#526879">and written records</text></g><g><circle cx="315" cy="215" r="18" fill="#9bcde8" stroke="#21618b" stroke-width="3"/><text x="315" y="268" font-size="19" font-weight="700" fill="#0a2034">Dissection</text><text x="315" y="296" font-size="15" fill="#526879">Direct study of</text><text x="315" y="317" font-size="15" fill="#526879">three-dimensional relations</text></g><g><circle cx="505" cy="215" r="18" fill="#f1d17a" stroke="#99731d" stroke-width="3"/><text x="505" y="102" font-size="19" font-weight="700" fill="#0a2034">Microscopy</text><text x="505" y="130" font-size="15" fill="#526879">Cells, tissues</text><text x="505" y="151" font-size="15" fill="#526879">and ultrastructure</text></g><g><circle cx="695" cy="215" r="18" fill="#f5b88e" stroke="#b85d32" stroke-width="3"/><text x="695" y="268" font-size="19" font-weight="700" fill="#0a2034">Medical imaging</text><text x="695" y="296" font-size="15" fill="#526879">Radiography, CT,</text><text x="695" y="317" font-size="15" fill="#526879">MRI and ultrasound</text></g><g><circle cx="875" cy="215" r="18" fill="#e2f8f4" stroke="#087e74" stroke-width="3"/><text x="875" y="102" font-size="19" font-weight="700" fill="#0a2034">Integration</text><text x="875" y="130" font-size="15" fill="#526879">Digital models,</text><text x="875" y="151" font-size="15" fill="#526879">clinical correlation</text></g></g><text x="500" y="376" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526879">Conceptual timeline of methods, not a complete chronology or ranking of cultures and contributors.</text></svg>