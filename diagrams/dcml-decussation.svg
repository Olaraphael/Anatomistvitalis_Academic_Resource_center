<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="t d"><title id="t">Dorsal column–medial lemniscus pathway and decussation</title><desc id="d">Three-neuron pathway: first-order sensory neuron ascends ipsilaterally in the dorsal columns to gracile or cuneate nuclei in the caudal medulla; second-order internal arcuate fibres cross the midline and form the medial lemniscus; third-order neuron reaches the VPL thalamus and primary somatosensory cortex.</desc><rect width="1000" height="660" rx="20" fill="#f5f9fc"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#0a2034">DORSAL COLUMN–MEDIAL LEMNISCUS (DCML)</text><text x="500" y="70" text-anchor="middle" font-family="Arial" font-size="15" fill="#536b7c">Discriminative touch · vibration · conscious proprioception from the body</text><rect x="55" y="110" width="250" height="485" rx="16" fill="#e5f3ef" stroke="#087d70" stroke-width="2"/><text x="180" y="142" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#075e56">SPINAL CORD</text><path d="M180 178 L180 430" stroke="#1674b8" stroke-width="9" stroke-linecap="round"/><circle cx="180" cy="180" r="15" fill="#1674b8"/><text x="195" y="202" font-family="Arial" font-size="15" fill="#164c76">1st-order neuron</text><text x="195" y="224" font-family="Arial" font-size="14" fill="#164c76">DRG cell body</text><text x="195" y="262" font-family="Arial" font-size="15" fill="#164c76">Ascends on SAME</text><text x="195" y="283" font-family="Arial" font-size="15" fill="#164c76">side (ipsilateral)</text><text x="195" y="304" font-family="Arial" font-size="14" fill="#164c76">Gracilis: lower body</text><text x="195" y="325" font-family="Arial" font-size="14" fill="#164c76">Cuneatus: upper body</text><path d="M180 430 L180 465" stroke="#1674b8" stroke-width="7"/><path d="M169 452 L180 468 L191 452" fill="none" stroke="#1674b8" stroke-width="5"/><rect x="350" y="110" width="300" height="485" rx="16" fill="#fff1e5" stroke="#c97823" stroke-width="2"/><text x="500" y="142" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#8a4c0d">CAUDAL MEDULLA</text><rect x="380" y="172" width="240" height="62" rx="10" fill="#fff" stroke="#c97823"/><text x="500" y="197" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#8a4c0d">Gracile / cuneate nuclei</text><text x="500" y="218" text-anchor="middle" font-family="Arial" font-size="14" fill="#8a4c0d">1st synapse</text><path d="M180 468 C260 468 330 205 380 205" fill="none" stroke="#1674b8" stroke-width="6"/><path d="M365 197 L382 205 L365 213" fill="none" stroke="#1674b8" stroke-width="5"/><text x="500" y="270" text-anchor="middle" font-family="Arial" font-size="15" fill="#8a4c0d">2nd-order axons become</text><text x="500" y="291" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#8a4c0d">internal arcuate fibres</text><path d="M430 310 C430 355 570 355 570 310" fill="none" stroke="#c43d54" stroke-width="7" stroke-linecap="round"/><path d="M554 319 L570 307 L576 327" fill="none" stroke="#c43d54" stroke-width="5"/><line x1="500" y1="302" x2="500" y2="370" stroke="#c43d54" stroke-width="2" stroke-dasharray="5 5"/><text x="500" y="395" text-anchor="middle" font-family="Arial" font-size="19" font-weight="bold" fill="#b12642">DECUSSATION</text><text x="500" y="417" text-anchor="middle" font-family="Arial" font-size="14" fill="#b12642">Crosses the midline here</text><path d="M570 430 L570 470" stroke="#c43d54" stroke-width="7"/><path d="M559 454 L570 472 L581 454" fill="none" stroke="#c43d54" stroke-width="5"/><text x="500" y="505" text-anchor="middle" font-family="Arial" font-size="15" fill="#8a4c0d">Forms the contralateral</text><text x="500" y="526" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#8a4c0d">medial lemniscus</text><rect x="695" y="110" width="250" height="485" rx="16" fill="#eaf0fb" stroke="#466ab1" stroke-width="2"/><text x="820" y="142" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold" fill="#294a91">THALAMUS &amp; CORTEX</text><rect x="720" y="190" width="200" height="66" rx="10" fill="#fff" stroke="#466ab1"/><text x="820" y="216" text-anchor="middle" font-family="Arial" font-size="17" font-weight="bold" fill="#294a91">VPL thalamus</text><text x="820" y="238" text-anchor="middle" font-family="Arial" font-size="14" fill="#294a91">2nd synapse</text><path d="M570 470 C645 470 650 222 720 222" fill="none" stroke="#c43d54" stroke-width="6"/><path d="M704 214 L722 222 L705 230" fill="none" stroke="#c43d54" stroke-width="5"/><text x="820" y="302" text-anchor="middle" font-family="Arial" font-size="15" fill="#294a91">3rd-order neuron</text><path d="M820 260 L820 350" stroke="#466ab1" stroke-width="6"/><path d="M809 334 L820 352 L831 334" fill="none" stroke="#466ab1" stroke-width="5"/><rect x="720" y="360" width="200" height="78" rx="10" fill="#fff" stroke="#466ab1"/><text x="820" y="389" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#294a91">Primary sensory</text><text x="820" y="410" text-anchor="middle" font-family="Arial" font-size="16" font-weight="bold" fill="#294a91">cortex (postcentral gyrus)</text><rect x="720" y="470" width="200" height="78" rx="10" fill="#dce7fa"/><text x="820" y="494" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="#294a91">Clinical rule</text><text x="820" y="516" text-anchor="middle" font-family="Arial" font-size="13" fill="#294a91">Cord lesion: often ipsilateral</text><text x="820" y="535" text-anchor="middle" font-family="Arial" font-size="13" fill="#294a91">loss below lesion; above crossing:</text><text x="820" y="554" text-anchor="middle" font-family="Arial" font-size="13" fill="#294a91">contralateral body representation</text><text x="500" y="630" text-anchor="middle" font-family="Arial" font-size="13" fill="#536b7c">Schematic only · Pathway simplified for learning; sensory information is processed through multiple circuits.</text></svg>