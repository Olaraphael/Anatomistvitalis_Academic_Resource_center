<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-labelledby="t d"><title id="t">Nine abdominal regions</title><desc id="d">Original front-view abdominal schematic showing the right and left hypochondriac, epigastric, right and left lumbar, umbilical, right and left iliac or inguinal, and hypogastric regions. Patient right is on viewer left.</desc><rect width="900" height="700" rx="24" fill="#f6fafc"/><text x="450" y="47" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0a2034">THE NINE ABDOMINAL REGIONS</text><path d="M320 94 Q287 106 274 144 L246 211 Q232 238 259 259 L286 275 L292 440 Q287 493 311 545 L589 545 Q613 493 608 440 L614 275 L641 259 Q668 238 654 211 L626 144 Q613 106 580 94 L528 115 L372 115 Z" fill="#e6c7a8" stroke="#17394e" stroke-width="4" stroke-linejoin="round"/><path d="M372 115Q384 155 380 190M528 115Q516 155 520 190" stroke="#b18a6d" stroke-width="3" fill="none"/><g stroke="#fff" stroke-width="3"><rect x="293" y="190" width="104" height="105" rx="6" fill="#f4b85c"/><rect x="397" y="190" width="104" height="105" rx="6" fill="#77c7e5"/><rect x="501" y="190" width="104" height="105" rx="6" fill="#f4b85c"/><rect x="293" y="295" width="104" height="105" rx="6" fill="#8bd3b5"/><rect x="397" y="295" width="104" height="105" rx="6" fill="#c1a6ed"/><rect x="501" y="295" width="104" height="105" rx="6" fill="#8bd3b5"/><rect x="293" y="400" width="104" height="105" rx="6" fill="#f3a6a6"/><rect x="397" y="400" width="104" height="105" rx="6" fill="#f4d58a"/><rect x="501" y="400" width="104" height="105" rx="6" fill="#f3a6a6"/></g><g font-family="Arial,sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#0a2034"><text x="345" y="231">RIGHT</text><text x="345" y="251">HYPOCHONDRIAC</text><text x="449" y="242">EPIGASTRIC</text><text x="553" y="231">LEFT</text><text x="553" y="251">HYPOCHONDRIAC</text><text x="345" y="338">RIGHT</text><text x="345" y="358">LUMBAR</text><text x="449" y="348">UMBILICAL</text><text x="553" y="338">LEFT</text><text x="553" y="358">LUMBAR</text><text x="345" y="443">RIGHT ILIAC</text><text x="345" y="463">/ INGUINAL</text><text x="449" y="443">HYPOGASTRIC</text><text x="449" y="463">/ PUBIC</text><text x="553" y="443">LEFT ILIAC</text><text x="553" y="463">/ INGUINAL</text></g><g font-family="Arial,sans-serif" font-size="16" fill="#17394e"><text x="72" y="222" font-weight="700">PATIENT'S</text><text x="72" y="245" font-weight="700">RIGHT</text><path d="M163 249H282" stroke="#17394e" stroke-width="2.5"/><path d="M272 241L282 249L272 257" stroke="#17394e" stroke-width="2.5" fill="none"/><text x="666" y="222" font-weight="700">PATIENT'S</text><text x="666" y="245" font-weight="700">LEFT</text><path d="M620 249H730" stroke="#17394e" stroke-width="2.5"/><path d="M630 241L620 249L630 257" stroke="#17394e" stroke-width="2.5" fill="none"/></g><g stroke="#17394e" stroke-width="3" stroke-dasharray="8 6"><path d="M397 180V515M501 180V515M280 295H618M280 400H618"/></g><text x="450" y="590" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#557080">Two vertical midclavicular lines and two horizontal planes</text><text x="450" y="614" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#557080">are used to describe the nine regions.</text><text x="450" y="665" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#557080">ANATOMISTVITALIS · ORIGINAL EDUCATIONAL SCHEMATIC · NOT TO SCALE</text></svg>