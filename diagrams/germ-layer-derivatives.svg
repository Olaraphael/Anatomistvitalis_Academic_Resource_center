<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" role="img" aria-labelledby="t d"><title id="t">Primary germ layers and broad derivatives</title><desc id="d">Three panels show ectoderm, mesoderm and endoderm with representative developmental derivatives.</desc><rect width="1100" height="560" rx="28" fill="#f7fafc"/><text x="45" y="60" font-family="Arial" font-size="34" font-weight="700" fill="#0a2034">THREE PRIMARY GERM LAYERS</text><text x="45" y="96" font-family="Arial" font-size="19" fill="#536b7c">Broad associations — not an exhaustive lineage map</text><g font-family="Arial"><rect x="45" y="130" width="310" height="330" rx="22" fill="#e5f2fb" stroke="#9cc6e1" stroke-width="2"/><rect x="395" y="130" width="310" height="330" rx="22" fill="#fcebdc" stroke="#e8bd8e" stroke-width="2"/><rect x="745" y="130" width="310" height="330" rx="22" fill="#e6f6ef" stroke="#9bd8be" stroke-width="2"/><text x="200" y="178" text-anchor="middle" font-size="27" font-weight="700" fill="#135b89">ECTODERM</text><text x="550" y="178" text-anchor="middle" font-size="27" font-weight="700" fill="#97541b">MESODERM</text><text x="900" y="178" text-anchor="middle" font-size="27" font-weight="700" fill="#17714f">ENDODERM</text><g font-size="19" fill="#18394b"><text x="75" y="230">• CNS and PNS</text><text x="75" y="270">• Epidermis</text><text x="75" y="310">• Hair and nails</text><text x="75" y="350">• Lens and inner ear</text><text x="75" y="390">• Neural crest derivatives</text><text x="425" y="230">• Muscle and bone</text><text x="425" y="270">• Connective tissue</text><text x="425" y="310">• Heart and vessels</text><text x="425" y="350">• Kidneys and gonads</text><text x="425" y="390">• Serous membranes</text><text x="775" y="230">• Gut epithelium</text><text x="775" y="270">• Respiratory lining</text><text x="775" y="310">• Liver parenchyma</text><text x="775" y="350">• Pancreatic epithelium</text><text x="775" y="390">• Most bladder lining</text></g><text x="550" y="505" text-anchor="middle" font-size="18" fill="#536b7c">Many organs contain derivatives from more than one germ layer.</text></g></svg>