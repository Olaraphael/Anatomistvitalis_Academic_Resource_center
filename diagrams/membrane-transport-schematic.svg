<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">Cell membrane transport mechanisms</title><desc id="d">Schematic comparison of simple diffusion, facilitated diffusion and active transport across a phospholipid bilayer.</desc><rect width="1000" height="520" rx="22" fill="#f4f8fb"/><text x="500" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0a2034">MEMBRANE TRANSPORT: THREE CORE MECHANISMS</text><g font-family="Arial,sans-serif"><g transform="translate(35 75)"><rect width="290" height="360" rx="16" fill="#fff" stroke="#dce6eb" stroke-width="2"/><text x="145" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0a2034">Simple diffusion</text><rect x="22" y="118" width="246" height="16" rx="8" fill="#79cfc5"/><rect x="22" y="142" width="246" height="16" rx="8" fill="#79cfc5"/><g fill="#21618b"><circle cx="48" cy="79" r="7"/><circle cx="76" cy="92" r="7"/><circle cx="103" cy="72" r="7"/><circle cx="137" cy="88" r="7"/><circle cx="170" cy="75" r="7"/><circle cx="202" cy="94" r="7"/><circle cx="238" cy="76" r="7"/></g><g fill="#21618b"><circle cx="72" cy="204" r="7"/><circle cx="149" cy="226" r="7"/><circle cx="226" cy="203" r="7"/></g><path d="M145 101 V184 l-8 -9 m8 9 l8 -9" stroke="#18b8a6" stroke-width="4" fill="none" stroke-linecap="round"/><text x="145" y="266" text-anchor="middle" font-size="15" fill="#192d3c">Down the concentration</text><text x="145" y="286" text-anchor="middle" font-size="15" fill="#192d3c">gradient; no carrier</text><text x="145" y="318" text-anchor="middle" font-size="14" fill="#526879">e.g. O₂, CO₂</text></g><g transform="translate(355 75)"><rect width="290" height="360" rx="16" fill="#fff" stroke="#dce6eb" stroke-width="2"/><text x="145" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0a2034">Facilitated diffusion</text><rect x="22" y="118" width="246" height="16" rx="8" fill="#79cfc5"/><rect x="22" y="142" width="246" height="16" rx="8" fill="#79cfc5"/><rect x="120" y="105" width="50" height="68" rx="16" fill="#f1d17a" stroke="#99731d" stroke-width="2"/><g fill="#21618b"><circle cx="52" cy="77" r="7"/><circle cx="84" cy="91" r="7"/><circle cx="118" cy="74" r="7"/><circle cx="151" cy="82" r="7"/><circle cx="188" cy="74" r="7"/><circle cx="230" cy="92" r="7"/></g><g fill="#21618b"><circle cx="145" cy="211" r="7"/><circle cx="145" cy="239" r="7"/></g><path d="M145 91 V197 l-8 -9 m8 9 l8 -9" stroke="#18b8a6" stroke-width="4" fill="none" stroke-linecap="round"/><text x="145" y="274" text-anchor="middle" font-size="15" fill="#192d3c">Down electrochemical</text><text x="145" y="294" text-anchor="middle" font-size="15" fill="#192d3c">gradient via a protein</text><text x="145" y="322" text-anchor="middle" font-size="14" fill="#526879">e.g. GLUT transporters</text></g><g transform="translate(675 75)"><rect width="290" height="360" rx="16" fill="#fff" stroke="#dce6eb" stroke-width="2"/><text x="145" y="34" text-anchor="middle" font-size="21" font-weight="700" fill="#0a2034">Active transport</text><rect x="22" y="118" width="246" height="16" rx="8" fill="#79cfc5"/><rect x="22" y="142" width="246" height="16" rx="8" fill="#79cfc5"/><rect x="120" y="105" width="50" height="68" rx="14" fill="#d5b3eb" stroke="#7950a0" stroke-width="2"/><g fill="#21618b"><circle cx="54" cy="80" r="7"/><circle cx="83" cy="89" r="7"/></g><g fill="#21618b"><circle cx="204" cy="199" r="7"/><circle cx="231" cy="222" r="7"/><circle cx="185" cy="236" r="7"/><circle cx="145" cy="210" r="7"/></g><path d="M145 196 V82 l-8 9 m8 -9 l8 9" stroke="#b85d32" stroke-width="4" fill="none" stroke-linecap="round"/><text x="145" y="266" text-anchor="middle" font-size="15" fill="#192d3c">Can move against gradient;</text><text x="145" y="286" text-anchor="middle" font-size="15" fill="#192d3c">requires energy coupling</text><text x="145" y="318" text-anchor="middle" font-size="14" fill="#526879">e.g. Na⁺/K⁺-ATPase</text></g></g><text x="500" y="475" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#526879">Teaching schematic; actual membrane proteins and transport cycles are more complex.</text></svg>