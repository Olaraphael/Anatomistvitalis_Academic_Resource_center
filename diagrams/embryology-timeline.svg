<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="t d"><title id="t">Early embryology timeline</title><desc id="d">A schematic timeline from fertilisation through the embryonic period, showing key developmental events by post-fertilisation week.</desc><rect width="1200" height="660" rx="28" fill="#f7fafc"/><text x="55" y="65" font-family="Arial" font-size="34" font-weight="700" fill="#0a2034">EARLY EMBRYOLOGY: WEEK-BY-WEEK</text><text x="55" y="103" font-family="Arial" font-size="20" fill="#526a7b">Post-fertilisation age • approximate landmarks</text><path d="M110 170 H1090" stroke="#9bb5c2" stroke-width="6" stroke-linecap="round"/><g font-family="Arial" fill="#0a2034" text-anchor="middle"><circle cx="135" cy="170" r="21" fill="#168b8b"/><text x="135" y="220" font-size="25" font-weight="700">Week 1</text><text x="135" y="257" font-size="18">Cleavage</text><text x="135" y="282" font-size="18">Morula</text><text x="135" y="307" font-size="18">Blastocyst</text><circle cx="365" cy="170" r="21" fill="#168b8b"/><text x="365" y="220" font-size="25" font-weight="700">Week 2</text><text x="365" y="257" font-size="18">Implantation</text><text x="365" y="282" font-size="18">Bilaminar disc</text><text x="365" y="307" font-size="18">Amnion / yolk sac</text><circle cx="595" cy="170" r="21" fill="#168b8b"/><text x="595" y="220" font-size="25" font-weight="700">Week 3</text><text x="595" y="257" font-size="18">Gastrulation</text><text x="595" y="282" font-size="18">Three germ layers</text><text x="595" y="307" font-size="18">Notochord / somites</text><circle cx="825" cy="170" r="21" fill="#168b8b"/><text x="825" y="220" font-size="25" font-weight="700">Week 4</text><text x="825" y="257" font-size="18">Neural tube closure</text><text x="825" y="282" font-size="18">Body folding</text><text x="825" y="307" font-size="18">Heart prominence</text><circle cx="1065" cy="170" r="21" fill="#b85b4c"/><text x="1065" y="220" font-size="25" font-weight="700">Weeks 5–8</text><text x="1065" y="257" font-size="18">Organogenesis</text><text x="1065" y="282" font-size="18">Limb / face shaping</text><text x="1065" y="307" font-size="18">Embryonic period ends</text></g><rect x="60" y="365" width="1080" height="225" rx="22" fill="#e8f5f3" stroke="#c1e1dc" stroke-width="2"/><text x="90" y="410" font-family="Arial" font-size="27" font-weight="700" fill="#0a2034">Quick recall</text><g font-family="Arial" font-size="22" fill="#12384a"><text x="100" y="465">1 — Divide</text><text x="100" y="510">2 — Two layers</text><text x="100" y="555">3 — Three layers</text><text x="570" y="465">4 — Fold and close</text><text x="570" y="510">5–8 — Build organ plans</text><text x="570" y="555">9 onward — Fetal growth and maturation</text></g><text x="60" y="630" font-family="Arial" font-size="18" fill="#536b7c">Gestational age is usually about two weeks greater than post-fertilisation age.</text></svg>