<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Neural pathway crossing levels</title><desc id="d">Original schematic showing the crossing of dorsal column, spinothalamic and corticospinal pathways.</desc><rect width="1200" height="680" rx="28" fill="#f4f8fb"/><text x="55" y="65" font-family="Arial" font-size="34" font-weight="700" fill="#0a2034">NEUROANATOMY: PATHWAYS &amp; CROSSINGS</text><text x="55" y="103" font-family="Arial" font-size="20" fill="#536b7c">Schematic teaching map — not to scale</text><rect x="55" y="140" width="1090" height="115" rx="18" fill="#e3f2f4" stroke="#b5d8de" stroke-width="2"/><text x="85" y="180" font-family="Arial" font-size="25" font-weight="700" fill="#0a2034">CEREBRAL CORTEX / THALAMUS</text><text x="85" y="220" font-family="Arial" font-size="20" fill="#0a2034">Sensory cortex receives relayed information • Motor cortex sends descending commands</text><rect x="55" y="285" width="1090" height="135" rx="18" fill="#fff" stroke="#cad7df" stroke-width="2"/><text x="85" y="325" font-family="Arial" font-size="25" font-weight="700" fill="#0a2034">MEDULLA</text><text x="85" y="360" font-family="Arial" font-size="18" fill="#536b7c">DCML crossing</text><path d="M350 375 C405 390 430 325 485 330" fill="none" stroke="#168b8b" stroke-width="8" stroke-linecap="round"/><path d="M470 320 L490 330 L470 341" fill="none" stroke="#168b8b" stroke-width="8"/><text x="525" y="355" font-family="Arial" font-size="20" fill="#0a2034">Discriminative touch / vibration cross here</text><rect x="55" y="450" width="1090" height="125" rx="18" fill="#eaf0fb" stroke="#c6d4ed" stroke-width="2"/><text x="85" y="490" font-family="Arial" font-size="25" font-weight="700" fill="#0a2034">SPINAL CORD</text><text x="85" y="525" font-family="Arial" font-size="18" fill="#536b7c">Spinothalamic crossing</text><path d="M350 535 C405 550 430 485 485 490" fill="none" stroke="#7c5cc4" stroke-width="8" stroke-linecap="round"/><path d="M470 480 L490 490 L470 501" fill="none" stroke="#7c5cc4" stroke-width="8"/><text x="525" y="515" font-family="Arial" font-size="20" fill="#0a2034">Pain / temperature cross near entry level</text><rect x="55" y="600" width="1090" height="48" rx="14" fill="#0a2034"/><text x="85" y="631" font-family="Arial" font-size="22" font-weight="700" fill="#8ce7dc">Memory cue: DCML = medulla • Pain / temperature = spinal cord • Corticospinal = pyramidal decussation</text></svg>