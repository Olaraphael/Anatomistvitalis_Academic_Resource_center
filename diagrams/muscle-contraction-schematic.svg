<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" role="img" aria-labelledby="t d"><title id="t">Skeletal muscle excitation-contraction coupling</title><desc id="d">Flow diagram from motor neuron signal to calcium release, troponin activation and actin-myosin cross-bridge cycling.</desc><rect width="1000" height="480" rx="24" fill="#f4f8fb"/><text x="500" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0a2034">SKELETAL MUSCLE: EXCITATION–CONTRACTION COUPLING</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="70" y="100" width="250" height="72" rx="14" fill="#d5b3eb" stroke="#7950a0" stroke-width="3"/><rect x="375" y="100" width="250" height="72" rx="14" fill="#9bcde8" stroke="#21618b" stroke-width="3"/><rect x="680" y="100" width="250" height="72" rx="14" fill="#f1d17a" stroke="#99731d" stroke-width="3"/><g fill="#0a2034" font-size="18" font-weight="700"><text x="195" y="129">Motor neuron signal</text><text x="195" y="151">ACh at neuromuscular junction</text><text x="500" y="129">Muscle action potential</text><text x="500" y="151">T-tubule activation</text><text x="805" y="129">Ca²⁺ release</text><text x="805" y="151">from sarcoplasmic reticulum</text></g><g stroke="#18b8a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M320 136 H367 l-8 -8 m8 8 l-8 8"/><path d="M625 136 H672 l-8 -8 m8 8 l-8 8"/><path d="M805 172 V225 H500 V250"/><path d="M500 250 l-8 -9 m8 9 l8 -9"/></g><rect x="325" y="250" width="350" height="76" rx="14" fill="#e2f8f4" stroke="#087e74" stroke-width="3"/><text x="500" y="279" font-size="19" font-weight="700" fill="#0a2034">Ca²⁺ binds troponin</text><text x="500" y="304" font-size="15" fill="#526879">Tropomyosin moves to expose actin sites</text><path d="M500 326 V363" stroke="#18b8a6" stroke-width="4"/><path d="M500 363 l-8 -9 m8 9 l8 -9" stroke="#18b8a6" stroke-width="4" fill="none"/><rect x="260" y="365" width="480" height="62" rx="14" fill="#fff" stroke="#dce6eb" stroke-width="2"/><text x="500" y="390" font-size="18" font-weight="700" fill="#0a2034">Actin–myosin cross-bridge cycling</text><text x="500" y="412" font-size="14" fill="#526879">ATP supports detachment and re-cocking; Ca²⁺ removal promotes relaxation.</text></g><text x="500" y="455" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#526879">Simplified sequence; excitation–contraction coupling involves additional proteins and regulatory steps.</text></svg>