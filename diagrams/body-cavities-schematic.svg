<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" role="img" aria-labelledby="t d"><title id="t">Major body cavities</title><desc id="d">Conceptual anterior view identifying cranial, vertebral, thoracic, abdominal and pelvic cavities.</desc><rect width="900" height="560" rx="24" fill="#f4f8fb"/><text x="450" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0a2034">MAJOR BODY CAVITIES</text><g transform="translate(95 72)"><circle cx="170" cy="54" r="38" fill="#d9e8f1" stroke="#12334b" stroke-width="3"/><path d="M144 91 L196 91 L220 118 L236 214 L218 286 L204 365 L213 422 L188 422 L170 354 L152 422 L127 422 L136 365 L122 286 L104 214 L120 118 Z" fill="#e7eef3" stroke="#12334b" stroke-width="3"/><ellipse cx="170" cy="54" rx="24" ry="25" fill="#79cfc5" stroke="#087e74" stroke-width="2"/><rect x="160" y="88" width="20" height="126" rx="10" fill="#9bcde8" stroke="#21618b" stroke-width="2"/><ellipse cx="170" cy="171" rx="58" ry="53" fill="#f5b88e" fill-opacity=".9" stroke="#b85d32" stroke-width="2"/><ellipse cx="170" cy="264" rx="55" ry="61" fill="#f1d17a" fill-opacity=".85" stroke="#99731d" stroke-width="2"/><ellipse cx="170" cy="337" rx="40" ry="31" fill="#d5b3eb" fill-opacity=".9" stroke="#7950a0" stroke-width="2"/></g><g font-family="Arial,sans-serif" fill="#192d3c"><g font-size="21" font-weight="700"><text x="385" y="132">Cranial cavity</text><text x="385" y="204">Vertebral (spinal) cavity</text><text x="385" y="277">Thoracic cavity</text><text x="385" y="350">Abdominal cavity</text><text x="385" y="423">Pelvic cavity</text></g><g font-size="16" fill="#526879"><text x="385" y="156">Contains the brain</text><text x="385" y="228">Contains the spinal cord</text><text x="385" y="301">Pleural cavities and mediastinum</text><text x="385" y="374">Contains many digestive organs</text><text x="385" y="447">Contains the urinary bladder and internal reproductive organs</text></g></g><g stroke="#617b8d" stroke-width="2" fill="none"><path d="M289 126 H360"/><path d="M276 160 H360"/><path d="M289 243 H360"/><path d="M289 336 H360"/><path d="M264 409 H360"/></g><text x="450" y="515" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#526879">Simplified orientation diagram; cavity boundaries are more complex in three dimensions.</text></svg>