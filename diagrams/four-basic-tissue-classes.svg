<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc"><title id="title">Four basic tissue classes</title><desc id="desc">Conceptual educational schematic of epithelial, connective, muscle and nervous tissue with defining structural patterns and functions.</desc><rect width="1000" height="560" rx="20" fill="#f5f9fc"/><text x="500" y="42" text-anchor="middle" font-family="Arial" font-size="26" font-weight="bold" fill="#0a2034">THE FOUR BASIC TISSUE CLASSES</text><g font-family="Arial"><rect x="45" y="75" width="435" height="205" rx="15" fill="#fff" stroke="#b85e77" stroke-width="2"/><text x="262" y="105" text-anchor="middle" font-size="21" font-weight="bold" fill="#9b3f5a">EPITHELIAL</text><g fill="#f5c4ce" stroke="#9b3f5a" stroke-width="2"><rect x="90" y="130" width="58" height="48" rx="5"/><rect x="150" y="130" width="58" height="48" rx="5"/><rect x="210" y="130" width="58" height="48" rx="5"/><rect x="270" y="130" width="58" height="48" rx="5"/><rect x="330" y="130" width="58" height="48" rx="5"/><rect x="390" y="130" width="45" height="48" rx="5"/></g><path d="M75 188 L440 188" stroke="#9b3f5a" stroke-width="4"/><text x="262" y="218" text-anchor="middle" font-size="15" fill="#4d3140">Closely packed cells · little matrix</text><text x="262" y="241" text-anchor="middle" font-size="14" fill="#4d3140">Covering, lining, secretion, absorption</text><rect x="520" y="75" width="435" height="205" rx="15" fill="#fff" stroke="#b9802b" stroke-width="2"/><text x="737" y="105" text-anchor="middle" font-size="21" font-weight="bold" fill="#8c5b14">CONNECTIVE</text><g stroke="#b9802b" stroke-width="2" fill="none"><path d="M565 137 Q620 120 670 151 T770 145 T900 155"/><path d="M565 165 Q630 190 690 160 T800 176 T900 164"/><path d="M565 190 Q630 172 700 205 T820 196 T900 208"/></g><g fill="#e8bd7d" stroke="#8c5b14" stroke-width="2"><ellipse cx="625" cy="148" rx="10" ry="6"/><ellipse cx="750" cy="183" rx="10" ry="6"/><ellipse cx="850" cy="140" rx="10" ry="6"/></g><text x="737" y="235" text-anchor="middle" font-size="15" fill="#5e491f">Cells embedded in extracellular matrix</text><text x="737" y="258" text-anchor="middle" font-size="14" fill="#5e491f">Support, binding, storage, transport, defence</text><rect x="45" y="305" width="435" height="205" rx="15" fill="#fff" stroke="#4386b4" stroke-width="2"/><text x="262" y="335" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a5276">MUSCLE</text><g stroke="#4386b4" stroke-width="2" fill="#b8d9ef"><rect x="90" y="360" width="340" height="25" rx="12"/><rect x="90" y="393" width="340" height="25" rx="12"/><rect x="90" y="426" width="340" height="25" rx="12"/></g><g stroke="#4386b4" stroke-width="1.5"><path d="M115 360 V385 M145 360 V385 M175 360 V385 M205 360 V385 M235 360 V385 M265 360 V385 M295 360 V385 M325 360 V385 M355 360 V385 M385 360 V385"/><path d="M115 393 V418 M145 393 V418 M175 393 V418 M205 393 V418 M235 393 V418 M265 393 V418 M295 393 V418 M325 393 V418 M355 393 V418 M385 393 V418"/></g><text x="262" y="474" text-anchor="middle" font-size="15" fill="#1a5276">Contractile cells with specialised filaments</text><text x="262" y="493" text-anchor="middle" font-size="14" fill="#1a5276">Movement, posture, propulsion, heat</text><rect x="520" y="305" width="435" height="205" rx="15" fill="#fff" stroke="#7951b2" stroke-width="2"/><text x="737" y="335" text-anchor="middle" font-size="21" font-weight="bold" fill="#58358c">NERVOUS</text><g stroke="#7951b2" stroke-width="4" stroke-linecap="round" fill="#d9c9f5"><circle cx="735" cy="405" r="23"/><path d="M714 393 L682 373 L663 353 M715 409 L680 424 L656 446 M755 396 L790 372 L810 350 M756 414 L789 434 L814 449 M758 405 L870 405"/></g><g stroke="#7951b2" stroke-width="2" fill="none"><path d="M682 373 L665 378 M680 424 L662 418 M790 372 L794 354 M789 434 L808 430"/></g><text x="737" y="474" text-anchor="middle" font-size="15" fill="#58358c">Excitable cells and supporting glia</text><text x="73