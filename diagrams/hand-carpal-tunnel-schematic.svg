<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Carpal tunnel and hand nerves</title><desc id="d">Simplified palmar wrist view showing the carpal tunnel, median nerve, flexor tendons and ulnar neurovascular bundle.</desc><rect width="900" height="500" rx="24" fill="#f4f8fb"/><text x="450" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0a2034">PALMAR WRIST: CARPAL TUNNEL AND NERVES</text><g transform="translate(95 70)"><path d="M160 25 C130 70 135 115 145 160 L160 265 C168 310 180 350 205 365 C230 350 242 310 250 265 L265 160 C275 115 280 70 250 25Z" fill="#f5d8bf" stroke="#b88562" stroke-width="3"/><path d="M145 160 Q205 185 265 160" fill="none" stroke="#99731d" stroke-width="8"/><rect x="151" y="173" width="108" height="70" rx="20" fill="#d9e8f1" stroke="#21618b" stroke-width="3"/><g fill="#b85d32" stroke="#8f3737" stroke-width="2"><circle cx="174" cy="194" r="9"/><circle cx="200" cy="194" r="9"/><circle cx="226" cy="194" r="9"/><circle cx="174" cy="220" r="9"/><circle cx="200" cy="220" r="9"/><circle cx="226" cy="220" r="9"/></g><circle cx="200" cy="174" r="11" fill="#7950a0" stroke="#4f3470" stroke-width="2"/><circle cx="276" cy="189" r="9" fill="#21618b"/><circle cx="276" cy="211" r="7" fill="#b85d32"/></g><g font-family="Arial,sans-serif"><text x="470" y="132" font-size="22" font-weight="700" fill="#99731d">Flexor retinaculum</text><text x="470" y="157" font-size="16" fill="#526879">Forms the roof of the carpal tunnel</text><path d="M360 148 H455" stroke="#99731d" stroke-width="3"/><text x="470" y="220" font-size="22" font-weight="700" fill="#7950a0">Median nerve</text><text x="470" y="245" font-size="16" fill="#526879">Passes through the carpal tunnel</text><path d="M295 244 H455" stroke="#7950a0" stroke-width="3"/><text x="470" y="310" font-size="22" font-weight="700" fill="#8f3737">Flexor tendons</text><text x="470" y="335" font-size="16" fill="#526879">Nine digital flexor tendons pass through</text><path d="M320 288 H455" stroke="#8f3737" stroke-width="3"/><text x="470" y="390" font-size="22" font-weight="700" fill="#21618b">Ulnar nerve and artery</text><text x="470" y="415" font-size="16" fill="#526879">Pass superficial to the flexor retinaculum</text><path d="M370 280 L455 382" stroke="#21618b" stroke-width="3"/></g><text x="450" y="465" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#526879">Simplified schematic; exact relationships and tendon arrangement require detailed cross-sectional study.</text></svg>