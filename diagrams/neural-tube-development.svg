<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 580" role="img" aria-labelledby="t d"><title id="t">Neurulation from plate to tube</title><desc id="d">Four schematic stages of neural plate, neural groove, approaching neural folds and a closed neural tube with neural crest cells.</desc><rect width="1100" height="580" rx="28" fill="#f6f9fb"/><text x="45" y="60" font-family="Arial" font-size="34" font-weight="700" fill="#0a2034">NEURULATION: FROM PLATE TO TUBE</text><text x="45" y="96" font-family="Arial" font-size="19" fill="#536b7c">Simplified cross-sections; not to scale</text><g font-family="Arial" text-anchor="middle" fill="#0a2034"><rect x="35" y="130" width="245" height="350" rx="18" fill="#fff" stroke="#d2dfe6" stroke-width="2"/><text x="157" y="170" font-size="22" font-weight="700">1. Neural plate</text><path d="M80 280 Q157 250 235 280 L235 310 Q157 335 80 310Z" fill="#4c9dd2" stroke="#1f689b" stroke-width="3"/><path d="M70 335 H245" stroke="#d7a45d" stroke-width="14" stroke-linecap="round"/><text x="157" y="390" font-size="17">Ectoderm thickens</text><text x="157" y="415" font-size="17">above notochord</text><rect x="305" y="130" width="245" height="350" rx="18" fill="#fff" stroke="#d2dfe6" stroke-width="2"/><text x="427" y="170" font-size="22" font-weight="700">2. Neural groove</text><path d="M350 280 Q390 335 427 350 Q464 335 505 280 L505 310 Q464 375 427 380 Q390 375 350 310Z" fill="#4c9dd2" stroke="#1f689b" stroke-width="3"/><path d="M340 335 H515" stroke="#d7a45d" stroke-width="14" stroke-linecap="round"/><text x="427" y="420" font-size="17">Neural folds elevate</text><rect x="575" y="130" width="245" height="350" rx="18" fill="#fff" stroke="#d2dfe6" stroke-width="2"/><text x="697" y="170" font-size="22" font-weight="700">3. Folds meet</text><path d="M620 280 Q640 345 675 335 L697 305 L719 335 Q754 345 775 280 L775 310 Q754 375 719 365 L697 335 L675 365 Q640 375 620 310Z" fill="#4c9dd2" stroke="#1f689b" stroke-width="3"/><circle cx="672" cy="275" r="9" fill="#b85b4c"/><circle cx="722" cy="275" r="9" fill="#b85b4c"/><text x="697" y="420" font-size="17">Neural crest emerges</text><rect x="845" y="130" width="220" height="350" rx="18" fill="#fff" stroke="#d2dfe6" stroke-width="2"/><text x="955" y="170" font-size="22" font-weight="700">4. Neural tube</text><ellipse cx="955" cy="300" rx="54" ry="46" fill="#4c9dd2" stroke="#1f689b" stroke-width="4"/><ellipse cx="955" cy="300" rx="22" ry="18" fill="#f6f9fb" stroke="#1f689b" stroke-width="3"/><circle cx="895" cy="265" r="10" fill="#b85b4c"/><circle cx="1015" cy="265" r="10" fill="#b85b4c"/><path d="M875 360 H1035" stroke="#d7a45d" stroke-width="14" stroke-linecap="round"/><text x="955" y="420" font-size="17">Tube forms CNS</text><text x="550" y="535" font-size="19" font-weight="700">Neural tube → brain and spinal cord • Neural crest → many PNS and other derivatives</text></g></svg>