<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">Cerebral arterial circulation: teaching schematic</title><desc id="desc">Simplified top-down schematic of anterior and posterior cerebral circulation and the communicating arteries of the Circle of Willis.</desc><rect width="1100" height="720" rx="28" fill="#f5f9fc"/><text x="550" y="54" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#123047">Cerebral arterial circulation</text><text x="550" y="86" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#456273">Simplified teaching schematic — territories vary between individuals</text><g fill="none" stroke="#b74c4c" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="M450 570 L450 460 L410 390 L365 310 L300 255"/><path d="M650 570 L650 460 L690 390 L735 310 L800 255"/><path d="M450 460 L450 320 L490 260 L510 200"/><path d="M650 460 L650 320 L610 260 L590 200"/><path d="M510 200 Q550 165 590 200"/><path d="M450 320 Q480 285 510 290"/><path d="M650 320 Q620 285 590 290"/><path d="M510 290 L590 290"/><path d="M365 310 L315 365"/><path d="M735 310 L785 365"/><path d="M510 200 L510 140"/><path d="M590 200 L590 140"/></g><g fill="#ffffff" stroke="#b74c4c" stroke-width="3"><circle cx="450" cy="460" r="10"/><circle cx="650" cy="460" r="10"/><circle cx="510" cy="200" r="10"/><circle cx="590" cy="200" r="10"/><circle cx="550" cy="290" r="10"/></g><g font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#16374b"><text x="250" y="230">MCA</text><text x="790" y="230">MCA</text><text x="410" y="125">ACA</text><text x="650" y="125">ACA</text><text x="465" y="330">Anterior communicating</text><text x="465" y="356">artery</text><text x="190" y="400">Internal carotid</text><text x="190" y="426">artery</text><text x="745" y="400">Internal carotid</text><text x="745" y="426">artery</text><text x="380" y="625">Vertebral arteries</text><text x="380" y="652">join to form basilar artery</text><text x="700" y="625">Basilar artery</text><text x="700" y="652">to posterior circulation</text><text x="465" y="495">Posterior</text><text x="465" y="521">communicating</text><text x="465" y="547">arteries</text><text x="80" y="690" font-size="15" font-weight="400" fill="#456273">ACA: anterior cerebral artery • MCA: middle cerebral artery • PCA: posterior cerebral artery (not fully depicted)</text></g><path d="M450 570 L550 620 L650 570" fill="none" stroke="#326b91" stroke-width="13" stroke-linecap="round"/><path d="M550 620 L550 560" fill="none" stroke="#326b91" stroke-width="13" stroke-linecap="round"/><path d="M550 560 L510 515 M550 560 L590 515" fill="none" stroke="#326b91" stroke-width="10" stroke-linecap="round"/></svg>