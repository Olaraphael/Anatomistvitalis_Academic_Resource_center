<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="720" viewBox="0 0 1100 720" role="img" aria-labelledby="title desc"><title id="title">Circle of Willis and major cerebral arteries</title><desc id="desc">Simplified inferior-view schematic showing internal carotid arteries, anterior cerebral arteries joined by anterior communicating artery, posterior communicating arteries, posterior cerebral arteries and basilar artery.</desc><rect width="1100" height="720" rx="28" fill="#f5f9fc"/><text x="550" y="52" text-anchor="middle" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#123047">Circle of Willis and major cerebral arteries</text><text x="550" y="82" text-anchor="middle" font-family="Arial,sans-serif" font-size="17" fill="#456273">Simplified inferior-view schematic • arterial variants are common</text><g fill="none" stroke="#b74c4c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"><path d="M410 520 L410 410 L410 310 L350 250 L300 180"/><path d="M690 520 L690 410 L690 310 L750 250 L800 180"/><path d="M410 310 L330 300 L260 270"/><path d="M690 310 L770 300 L840 270"/><path d="M410 310 Q450 250 500 235"/><path d="M690 310 Q650 250 600 235"/><path d="M500 235 Q550 205 600 235"/><path d="M410 410 L470 360 L500 300"/><path d="M690 410 L630 360 L600 300"/><path d="M500 300 Q550 275 600 300"/><path d="M500 300 L500 235"/><path d="M600 300 L600 235"/></g><path d="M550 620 L550 490" fill="none" stroke="#326b91" stroke-width="16" stroke-linecap="round"/><path d="M550 490 L500 420 L470 360" fill="none" stroke="#326b91" stroke-width="14" stroke-linecap="round"/><path d="M550 490 L600 420 L630 360" fill="none" stroke="#326b91" stroke-width="14" stroke-linecap="round"/><g fill="#fff" stroke="#b74c4c" stroke-width="3"><circle cx="410" cy="310" r="10"/><circle cx="690" cy="310" r="10"/><circle cx="500" cy="235" r="10"/><circle cx="600" cy="235" r="10"/><circle cx="500" cy="300" r="10"/><circle cx="600" cy="300" r="10"/></g><g font-famil