<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 650" role="img" aria-labelledby="t d"><title id="t">Four abdominal quadrants</title><desc id="d">Original educational schematic of a front-facing abdomen divided into right upper, left upper, right lower and left lower quadrants. The patient's right is on the viewer's left.</desc><rect width="760" height="650" rx="24" fill="#f6fafc"/><text x="380" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0a2034">THE FOUR ABDOMINAL QUADRANTS</text><path d="M270 105 Q238 115 226 155 L200 228 Q187 255 214 276 L245 291 L250 410 Q247 468 267 516 L493 516 Q513 468 510 410 L515 291 L546 276 Q573 255 560 228 L534 155 Q522 115 490 105 L446 125 L314 125 Z" fill="#e6c7a8" stroke="#17394e" stroke-width="4" stroke-linejoin="round"/><path d="M314 125Q325 162 320 190M446 125Q435 162 440 190" stroke="#b18a6d" stroke-width="3" fill="none"/><rect x="252" y="190" width="128" height="150" rx="10" fill="#f4b85c" fill-opacity=".8" stroke="#fff" stroke-width="3"/><rect x="380" y="190" width="128" height="150" rx="10" fill="#77c7e5" fill-opacity=".85" stroke="#fff" stroke-width="3"/><rect x="252" y="340" width="128" height="150" rx="10" fill="#8bd3b5" fill-opacity=".9" stroke="#fff" stroke-width="3"/><rect x="380" y="340" width="128" height="150" rx="10" fill="#c1a6ed" fill-opacity=".85" stroke="#fff" stroke-width="3"/><path d="M380 190V490M252 340H508" stroke="#17394e" stroke-width="4" stroke-dasharray="9 6"/><g font-family="Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#0a2034"><text x="316" y="245">RUQ</text><text x="316" y="274" font-size="15">Right upper</text><text x="444" y="245">LUQ</text><text x="444" y="274" font-size="15">Left upper</text><text x="316" y="397">RLQ</text><text x="316" y="426" font-size="15">Right lower</text><text x="444" y="397">LLQ</text><text x="444" y="426" font-size="15">Left lower</text></g><g font-family="Arial,sans-serif" font-size="16" fill="#17394e"><text x="88" y="210" font-weight="700">PATIENT'S</text><text x="88" y="234" font-weight="700">RIGHT</text><path d="M166 238H239" stroke="#17394e" stroke-width="2.5"/><path d="M229 230L239 238L229 246" stroke="#17394e" stroke-width="2.5" fill="none"/><text x="548" y="210" font-weight="700">PATIENT'S</text><text x="548" y="234" font-weight="700">LEFT</text><path d="M520 238H600" stroke="#17394e" stroke-width="2.5"/><path d="M530 230L520 238L530 246" stroke="#17394e" stroke-width="2.5" fill="none"/></g><text x="380" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#557080">A vertical median plane and a horizontal transumbilical plane</text><text x="380" y="589" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#557080">divide the abdomen into four descriptive quadrants.</text><text x="380" y="625" text-anchor="middle" font-family="Arial,sans-serif" font-size="12" fill="#557080">ANATOMISTVITALIS · ORIGINAL EDUCATIONAL SCHEMATIC · NOT TO SCALE</text></svg>