<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" role="img" aria-labelledby="title desc"><title id="title">Autonomic nervous system organisation</title><desc id="desc">Comparison of sympathetic and parasympathetic pathways, showing central outflow, ganglion position, relative preganglionic and postganglionic fibre lengths, and target organs.</desc><rect width="1000" height="520" rx="22" fill="#f7fafc"/><text x="500" y="38" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#102a43">AUTONOMIC NERVOUS SYSTEM: TWO MAJOR OUTFLOWS</text><rect x="70" y="75" width="860" height="66" rx="14" fill="#e6edf3" stroke="#718096" stroke-width="2"/><text x="500" y="103" text-anchor="middle" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#102a43">Central autonomic networks</text><text x="500" y="125" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#526879">Hypothalamus, brainstem and spinal cord coordinate visceral responses</text><rect x="95" y="175" width="370" height="280" rx="18" fill="#fff4ef" stroke="#b85d32" stroke-width="2"/><rect x="535" y="175" width="370" height="280" rx="18" fill="#edf8f6" stroke="#087e74" stroke-width="2"/><text x="280" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#963f22">Sympathetic</text><text x="720" y="207" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="700" fill="#087e74">Parasympathetic</text><rect x="130" y="235" width="130" height="55" rx="10" fill="#f5b88e" stroke="#b85d32" stroke-width="2"/><rect x="300" y="235" width="130" height="55" rx="10" fill="#f5b88e" stroke="#b85d32" stroke-width="2"/><text x="195" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#542719">Short</text><text x="195" y="276" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#542719">preganglionic</text><text x="365" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#542719">Long</text><text x="365" y="276" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#542719">postganglionic</text><rect x="570" y="235" width="130" height="55" rx="10" fill="#9edbd2" stroke="#087e74" stroke-width="2"/><rect x="740" y="235" width="130" height="55" rx="10" fill="#9edbd2" stroke="#087e74" stroke-width="2"/><text x="635" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#064e47">Long</text><text x="635" y="276" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#064e47">preganglionic</text><text x="805" y="258" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#064e47">Short</text><text x="805" y="276" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#064e47">postganglionic</text><g stroke-width="4" fill="none" stroke-linecap="round"><path d="M260 263 H292" stroke="#b85d32"/><path d="M430 263 H450 V330 H280 V348" stroke="#b85d32"/><path d="M700 263 H732" stroke="#087e74"/><path d="M870 263 H885 V330 H720 V348" stroke="#087e74"/></g><g fill="#fff" stroke-width="2"><rect x="180" y="348" width="200" height="50" rx="10" stroke="#b85d32"/><rect x="620" y="348" width="200" height="50" rx="10" stroke="#087e74"/></g><g font-family="Arial,sans-serif" text-anchor="middle"><text x="280" y="369" font-size="16" font-weight="700" fill="#102a43">Visceral target</text><text x="280" y="387" font-size="13" fill="#526879">e.g. heart, vessels, glands</text><text x="720" y="369" font-size="16" font-weight="700" fill="#102a43">Visceral target</text><text x="720" y="387" font-size="13" fill="#526879">e.g. gut, bladder, glands</text></g><text x="500" y="478" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526879">Schematic comparison only: origins, ganglia and target effects differ by organ; exceptions exist.</text><text x="500" y="499" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#526879">Both divisions use acetylcholine at preganglionic synapses; most sympathetic postganglionic fibres release noradrenaline.</text></svg>