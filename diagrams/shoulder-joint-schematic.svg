<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" role="img" aria-labelledby="t d"><title id="t">Shoulder joint and rotator cuff</title><desc id="d">Conceptual shoulder joint diagram showing humeral head, glenoid cavity and rotator cuff tendons.</desc><rect width="900" height="500" rx="24" fill="#f4f8fb"/><text x="450" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0a2034">GLENOHUMERAL JOINT: STABILITY AND MOBILITY</text><g transform="translate(80 65)"><path d="M250 70 C190 35 125 65 105 130 C90 185 125 235 170 245 L195 218 C165 194 155 163 168 133 C181 101 215 95 243 113Z" fill="#9bcde8" stroke="#21618b" stroke-width="4"/><path d="M270 95 C320 78 362 110 368 151 C374 192 346 222 309 222 C273 222 249 196 249 162 C249 133 257 111 270 95Z" fill="#f1d17a" stroke="#99731d" stroke-width="4"/><path d="M245 115 Q230 160 250 201" stroke="#b85d32" stroke-width="13" fill="none" stroke-linecap="round"/><path d="M260 105 Q310 72 350 105" stroke="#7950a0" stroke-width="14" fill="none" stroke-linecap="round"/><path d="M246 203 Q300 244 345 210" stroke="#087e74" stroke-width="14" fill="none" stroke-linecap="round"/><path d="M240 120 Q210 145 220 182" stroke="#b85d32" stroke-width="14" fill="none" stroke-linecap="round"/><path d="M260 100 Q292 83 325 94" stroke="#7950a0" stroke-width="14" fill="none" stroke-linecap="round"/></g><g font-family="Arial,sans-serif"><text x="510" y="125" font-size="22" font-weight="700" fill="#21618b">Glenoid cavity</text><text x="510" y="151" font-size="16" fill="#526879">Shallow socket of scapula</text><path d="M445 137 H495" stroke="#21618b" stroke-width="3"/><text x="510" y="210" font-size="22" font-weight="700" fill="#99731d">Humeral head</text><text x="510" y="236" font-size="16" fill="#526879">Articulating surface</text><path d="M440 213 H495" stroke="#99731d" stroke-width="3"/><text x="510" y="300" font-size="22" font-weight="700" fill="#7950a0">Rotator cuff</text><text x="510" y="326" font-size="16" fill="#526879">SITS: supraspinatus, infraspinatus,</text><text x="510" y="349" font-size="16" fill="#526879">teres minor and subscapularis</text><path d="M435 293 H495" stroke="#7950a0" stroke-width="3"/></g><text x="450" y="445" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526879">Simplified schematic, not to scale. Stability also depends on the labrum, capsule, ligaments and dynamic muscle control.</text></svg>