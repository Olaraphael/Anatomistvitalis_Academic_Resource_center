<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" role="img" aria-labelledby="t d"><title id="t">Levels of biological organisation</title><desc id="d">A sequence from molecules and organelles through cells, tissues, organs, organ systems and the organism.</desc><rect width="1000" height="380" rx="24" fill="#f4f8fb"/><text x="500" y="42" text-anchor="middle" font-family="Arial,sans-serif" font-size="27" font-weight="700" fill="#0a2034">LEVELS OF BIOLOGICAL ORGANISATION</text><g font-family="Arial,sans-serif" text-anchor="middle"><g fill="#d9e8f1" stroke="#21618b" stroke-width="2"><rect x="30" y="100" width="130" height="116" rx="14"/><rect x="190" y="100" width="130" height="116" rx="14"/><rect x="350" y="100" width="130" height="116" rx="14"/><rect x="510" y="100" width="130" height="116" rx="14"/><rect x="670" y="100" width="130" height="116" rx="14"/><rect x="830" y="100" width="140" height="116" rx="14"/></g><g fill="#0a2034" font-size="18" font-weight="700"><text x="95" y="143">Molecules &amp;</text><text x="95" y="166">organelles</text><text x="255" y="154">Cells</text><text x="415" y="154">Tissues</text><text x="575" y="154">Organs</text><text x="735" y="143">Organ</text><text x="735" y="166">systems</text><text x="900" y="154">Organism</text></g><g fill="#526879" font-size="13"><text x="95" y="192">e.g. proteins</text><text x="255" y="192">e.g. neuron</text><text x="415" y="192">e.g. nervous</text><text x="575" y="192">e.g. brain</text><text x="735" y="192">e.g. nervous</text><text x="900" y="192">whole person</text></g><g stroke="#18b8a6" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M163 158 H184 l-7 -7 m7 7 l-7 7"/><path d="M323 158 H344 l-7 -7 m7 7 l-7 7"/><path d="M483 158 H504 l-7 -7 m7 7 l-7 7"/><path d="M643 158 H664 l-7 -7 m7 7 l-7 7"/><path d="M803 158 H824 l-7 -7 m7 7 l-7 7"/></g></g><text x="500" y="274" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" fill="#192d3c">Each level emerges from organised interactions at the level below.</text><text x="500" y="308" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526879">This is a teaching model; real biological systems include feedback and cross-level interactions.</text></svg>