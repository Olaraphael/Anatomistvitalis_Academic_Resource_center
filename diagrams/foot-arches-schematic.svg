<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d"><title id="t">Arches of the foot</title><desc id="d">Conceptual medial and lateral longitudinal arches with a transverse arch and load transfer through the foot.</desc><rect width="1000" height="470" rx="24" fill="#f4f8fb"/><text x="500" y="40" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#0a2034">FOOT ARCHES AND LOAD DISTRIBUTION</text><g transform="translate(70 70)"><path d="M85 55 C130 25 185 55 205 100 C225 140 250 190 300 220 C360 255 420 280 500 295 C535 302 550 325 525 345 C480 365 380 350 305 325 C230 300 175 250 145 195 C115 140 95 100 85 55Z" fill="#f5d8bf" stroke="#b88562" stroke-width="4"/><path d="M120 95 Q185 115 220 190 Q260 255 350 292" fill="none" stroke="#087e74" stroke-width="10" stroke-linecap="round"/><path d="M135 135 Q205 155 250 220 Q300 270 385 310" fill="none" stroke="#21618b" stroke-width="8" stroke-linecap="round"/><path d="M130 125 L200 115 L270 130" fill="none" stroke="#7950a0" stroke-width="8" stroke-linecap="round"/></g><g font-family="Arial,sans-serif"><text x="650" y="135" font-size="22" font-weight="700" fill="#087e74">Medial longitudinal arch</text><text x="650" y="160" font-size="16" fill="#526879">Higher, more elastic; supports load and</text><text x="650" y="183" font-size="16" fill="#526879">helps store and return energy</text><path d="M410 230 L620 145" stroke="#087e74" stroke-width="3"/><text x="650" y="245" font-size="22" font-weight="700" fill="#21618b">Lateral longitudinal arch</text><text x="650" y="270" font-size="16" fill="#526879">Lower and more stable during weight bearing</text><path d="M450 255 L620 252" stroke="#21618b" stroke-width="3"/><text x="650" y="335" font-size="22" font-weight="700" fill="#7950a0">Transverse arch</text><text x="650" y="360" font-size="16" fill="#526879">Spans the foot mediolaterally</text><path d="M320 190 L620 342" stroke="#7950a0" stroke-width="3"/></g><text x="500" y="435" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#526879">Conceptual arch diagram; actual bone alignment and load distribution vary with posture and movement.</text></svg>