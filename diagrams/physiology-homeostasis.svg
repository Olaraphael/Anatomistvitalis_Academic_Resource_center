<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-labelledby="t d"><title id="t">Physiology and homeostasis overview</title><desc id="d">A central homeostasis controller exchanges feedback with cardiovascular, respiratory, renal, nervous, endocrine and digestive systems.</desc><rect width="900" height="420" rx="20" fill="#f5f9fc"/><text x="450" y="38" text-anchor="middle" font-family="Arial" font-size="25" font-weight="bold" fill="#0a2034">PHYSIOLOGY: SYSTEMS WORK TOGETHER</text><g stroke="#8aa5b4" stroke-width="3" fill="none"><path d="M450 210 L190 115"/><path d="M450 210 L450 100"/><path d="M450 210 L710 115"/><path d="M450 210 L190 310"/><path d="M450 210 L450 330"/><path d="M450 210 L710 310"/></g><g font-family="Arial" text-anchor="middle"><rect x="335" y="165" width="230" height="90" rx="18" fill="#0a2034"/><text x="450" y="198" font-size="21" font-weight="bold" fill="#fff">HOMEOSTASIS</text><text x="450" y="223" font-size="14" fill="#c6f4ed">Sensors · control · effectors</text><rect x="65" y="72" width="250" height="75" rx="14" fill="#d9eeff" stroke="#4386b4" stroke-width="2"/><text x="190" y="101" font-size="18" font-weight="bold" fill="#1a5276">Cardiovascular</text><text x="190" y="124" font-size="14" fill="#1a5276">Pressure · perfusion · transport</text><rect x="325" y="55" width="250" height="75" rx="14" fill="#dff5e9" stroke="#25875b" stroke-width="2"/><text x="450" y="84" font-size="18" font-weight="bold" fill="#17603e">Respiratory</text><text x="450" y="107" font-size="14" fill="#17603e">O₂ uptake · CO₂ removal</text><rect x="585" y="72" width="250" height="75" rx="14" fill="#fff0d9" stroke="#bd7a21" stroke-width="2"/><text x="710" y="101" font-size="18" font-weight="bold" fill="#85500e">Renal</text><text x="710" y="124" font-size="14" fill="#85500e">Water · electrolytes · pH</text><rect x="65" y="272" width="250" height="75" rx="14" fill="#eee4ff" stroke="#7951b2" stroke-width="2"/><text x="190" y="301" font-size="18" font-weight="bold" fill="#58358c">Nervous &amp; endocrine</text><text x="190" y="324" font-size="14" fill="#58358c">Fast signals · hormonal control</text><rect x="325" y="300" width="250" height="75" rx="14" fill="#ffe2e7" stroke="#b94e68" stroke-width="2"/><text x="450" y="329" font-size="18" font-weight="bold" fill="#8f2f49">Digestive</text><text x="450" y="352" font-size="14" fill="#8f2f49">Nutrients · absorption · energy</text><rect x="585" y="272" width="250" height="75" rx="14" fill="#dff3f2" stroke="#16827b" stroke-width="2"/><text x="710" y="301" font-size="18" font-weight="bold" fill="#0b625c">Muscle &amp; skin</text><text x="710" y="324" font-size="14" fill="#0b625c">Movement · heat · protection</text></g><text x="450" y="402" text-anchor="middle" font-family="Arial" font-size="13" fill="#536b7c">Conceptual map: feedback and coordination link the organ systems.</text></svg>